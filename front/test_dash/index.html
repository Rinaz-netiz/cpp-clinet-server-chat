<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orange Messenger</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
</head>
<body>
  <div class="app-container">
    <!-- Боковая панель с чатами -->
    <aside class="sidebar">
      <header class="sidebar-header">
        <button class="menu-btn">☰</button>
        <input type="text" placeholder="Поиск" class="search-input">
      </header>
      
      <div class="chat-list">
        <!-- Пример чата -->
        <div class="chat-item active">
          <div class="chat-avatar" style="background-color: #ff8c42;">И</div>
          <div class="chat-info">
            <div class="chat-name">Иван Петров</div>
            <div class="chat-preview">Привет, как дела?</div>
          </div>
          <div class="chat-meta">
            <div class="chat-time">12:30</div>
            <div class="unread-count">2</div>
          </div>
        </div>
        
        <!-- Еще чаты -->
        <div class="chat-item">
          <div class="chat-avatar" style="background-color: #9b5de5;">А</div>
          <div class="chat-info">
            <div class="chat-name">Анна Сидорова</div>
            <div class="chat-preview">Жду документы!</div>
          </div>
          <div class="chat-meta">
            <div class="chat-time">Вчера</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Основное окно чата -->
    <main class="chat-area">
      <header class="chat-header">
        <div class="chat-partner">
          <div class="partner-avatar" style="background-color: #ff8c42;">И</div>
          <div class="partner-info">
            <div class="partner-name">Иван Петров</div>
            <div class="partner-status">online</div>
          </div>
        </div>
        <button class="call-btn">📞</button>
      </header>
      
      <div class="messages-container">
        <!-- Пример сообщений -->
        <div class="message received">
          <div class="message-text">Привет! Как твои дела?</div>
          <div class="message-time">12:30</div>
        </div>
        
        <div class="message sent">
          <div class="message-text">Всё отлично, спасибо! 😊</div>
          <div class="message-time">12:32</div>
        </div>
      </div>
      
      <footer class="message-input-area">
        <button class="attach-btn">📎</button>
        <input type="text" placeholder="Введите сообщение..." class="message-input">
        <button class="send-btn">➤</button>
      </footer>
    </main>
  </div>
</body>
</html>
